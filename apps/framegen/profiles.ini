; framegen per-game profiles.
;
; Settings resolve in this order, later winning:
;   built-in defaults -> [default] -> [<game>.exe] -> command-line options
; Section names are the game's executable file name (case-insensitive).
;
; Keys:
;   multiplier       2-4   output frames per source frame
;   search           1-16  coarse motion search radius in pixels; raise for fast cameras
;   occlusion        0-1   disagreement that stops blending; lower = less ghosting, more judder
;   sharpen          0-1   sharpening strength
;   scale            0/1   fill the monitor, scaling the game
;   vsync            0/1   align presents to display refresh
;   max-interval-ms  n     no generation when source frames are further apart

[default]
multiplier=2
search=4
occlusion=0.12
sharpen=0

; Example: fast first-person camera, large motion between frames.
; [example-shooter.exe]
; search=8
; occlusion=0.10

; Example: slow camera, lots of static HUD and text.
; [example-strategy.exe]
; search=2
; occlusion=0.08
